
# Nome da aplicação
spring.application.name=odrcon-backend
spring.config.import=optional:file:./.env[.properties]

# Conexão com PostgreSQL no Neon
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/neondb?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Exibir SQL durante o desenvolvimento
spring.jpa.show-sql=true

# Porta do servidor
server.port=8080

# Nível de logs de segurança
logging.level.org.springframework.security=INFO

# Configuração da integração com Google Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.1-flash-lite}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.timeout=${GEMINI_API_TIMEOUT:${gemini.api.timeout-seconds:15}s}
gemini.api.total-timeout=${GEMINI_API_TOTAL_TIMEOUT:25s}
gemini.api.max-attempts=${GEMINI_API_MAX_ATTEMPTS:2}
gemini.api.initial-backoff=${GEMINI_API_INITIAL_BACKOFF:300ms}
gemini.api.max-output-tokens=${GEMINI_API_MAX_OUTPUT_TOKENS:4096}
gemini.api.temperature=${GEMINI_API_TEMPERATURE:0.1}
#Perfil
spring.profiles.active=dev
