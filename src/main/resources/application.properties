
# Nome da aplicação
spring.application.name=odrcon-backend

# Conexão com PostgreSQL no Neon
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/neondb?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Exibir SQL durante o desenvolvimento
spring.jpa.show-sql=true

# Porta do servidor
server.port=8080

# Nível de logs de segurança
logging.level.org.springframework.security=INFO

# Configuração da integração com Google Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.timeout-seconds=15
